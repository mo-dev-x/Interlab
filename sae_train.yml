# SAELens training config for Qwen2.5-14B
# Target: residual stream, mid-late layers (~layer 24)

model_name: "Qwen/Qwen2.5-14B"
model_class_name: "AutoModelForCausalLM"

# Hook point — residual stream post-attention at layer 24
# Adjust layer after looking at loss/feature quality across layers
hook_name: "model.layers.24.post_feedforward_layernorm"
hook_layer: 24
hook_head_index: null

# Architecture
d_in: 5120              # Qwen2.5-14B hidden dim
expansion_factor: 16    # dictionary size = d_in * expansion_factor = 81920 features
b_dec_to_z: false
normalize_activations: "none"

# Training
architecture: "topk"   # TopK SAE — cleaner than ReLU for feature quality
k: 100                 # active features per token (same as Qwen-Scope)

# Data
dataset_path: "monology/pile-uncopyrighted"
is_dataset_tokenized: false
context_size: 512
prepend_bos: true

# Training hyperparams
training_tokens: 200_000_000    # 200M tokens — enough for good features in 4 days
train_batch_size_tokens: 4096
store_batch_size_prompts: 16

# Optimizer
lr: 2e-4
lr_scheduler_name: "cosine"
lr_warm_up_steps: 1000
lr_decay_steps: 5000
adam_beta1: 0.9
adam_beta2: 0.999

# Regularization (TopK doesn't use L1, but keep for reference)
l1_coefficient: 0.0
l1_warm_up_steps: 0

# Logging & checkpointing
log_to_wandb: true
wandb_project: "qwen-sae-interp"
wandb_entity: null           # set to your wandb username
wandb_log_frequency: 100
eval_every_n_wandb_logs: 10

n_checkpoints: 5
checkpoint_path: "results/sae_checkpoints"

# Performance
dtype: "bfloat16"
device: "cuda"
compile_llm: false           # set true if on H100 for ~20% speedup
llm_batch_size: 4            # reduce if OOM on smaller GPUs
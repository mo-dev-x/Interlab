name: CI

# §8.3: "Every commit: all hard tests (< 5 min budget; fixtures are tiny)."
# Nightly/cluster-only tests (identity-on-Qwen, canary_cheese) are excluded
# by pyproject.toml's own pytest addopts (`-m "not nightly"`), not by this
# workflow -- the same command a developer runs locally is what runs here.
# This gate never launches a SLURM job (§8.3: "No commit gate runs SLURM
# jobs.") and never touches the cluster.

on:
  push:
  pull_request:

jobs:
  hard-tests:
    name: ruff + hard test suite
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 IS LOAD-BEARING, NOT A CONVENIENCE. The default is
      # fetch-depth: 1 -- a ONE-COMMIT clone -- and several loaders in this
      # repository read their frozen bytes from `git show <pinned-rev>:<path>`
      # with a digest-checked on-disk fallback. Under a depth-1 clone the
      # pinned objects are absent, so every one of them silently took its
      # FALLBACK and CI never once exercised the git-preferred path it claims
      # to test. The pinned revs that depend on full history:
      #   c9dd6a7  persona v2 corpus     scripts/final_pairing/final_pairing_concept_discovery.py
      #   98a7108  pre-C2 source         scripts/final_pairing/verify_gate_fixes.py
      #   4edeca4  regression fixture    conformance/final_pairing/v2/discrimination_fixtures.py
      #   220329b  frozen description    conformance/final_pairing/v2/corpus_implements_definition.py
      #   880b48a  v1 corpus             conformance/final_pairing/v2/corpus_implements_definition.py
      # All five are ancestors of this branch's HEAD, so a full fetch resolves
      # them; if a pin is ever moved to an unreachable object, no fetch depth
      # will save it and the loader must fail loudly rather than fall back.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync environment
        run: uv sync --extra dev --frozen

      # scripts/*.py does NOT recurse, so scripts/final_pairing/ -- where this sprint's
      # discovery, gate and intervention code lives -- was outside the gate entirely.
      # Measured at the moment of widening: a recursive run over that directory returned
      # ZERO findings, so this locks in a clean state rather than opening a backlog.
      # scripts/legacy stays excluded (frozen); scripts/research holds no Python.
      - name: Ruff (interplab, tests, top-level + final_pairing scripts -- scripts/legacy is frozen and excluded)
        run: uv run ruff check interplab tests scripts/*.py scripts/final_pairing/*.py data/concepts/*.py

      - name: Hard test suite
        run: uv run pytest

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 72" width="300" height="72" role="img" aria-label="Interlab">
  <title>Interlab</title>
  <desc>A sparse lattice of features with one active trace running through it, beside the Interlab wordmark.</desc>
  <g transform="translate(4,4)">
    <g fill="currentColor" opacity="0.32">
      <circle cx="11" cy="11" r="2.6"/>
      <circle cx="25" cy="11" r="2.6"/>

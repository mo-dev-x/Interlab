      <circle cx="11" cy="25" r="2.6"/>
      <circle cx="25" cy="25" r="2.6"/>
      <circle cx="53" cy="25" r="2.6"/>
      <circle cx="11" cy="39" r="2.6"/>
      <circle cx="39" cy="39" r="2.6"/>
      <circle cx="53" cy="39" r="2.6"/>
      <circle cx="25" cy="53" r="2.6"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 72" width="300" height="72" role="img" aria-label="Interlab">
  <title>Interlab</title>
  <desc>A sparse lattice of features with one active trace running through it, beside the Interlab wordmark.</desc>
  <style>
    .pulse { opacity: 0; stroke-dasharray: 18 200; stroke-dashoffset: 18; animation: travel 6s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    .halo { opacity: 0; fill: #6ea8dc; animation: ping 6s ease-out infinite; }
    @keyframes travel {
      0% { stroke-dashoffset: 18; opacity: 0; }
      4% { opacity: 1; }
      36% { opacity: 1; }
      40%, 100% { stroke-dashoffset: -100; opacity: 0; }
    }
    @keyframes ping {
      0% { opacity: 0.35; transform: scale(1); }
      14%, 100% { opacity: 0; transform: scale(2.1); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g transform="translate(4,4)">
    <g fill="#e6edf3" opacity="0.32">
      <circle cx="11" cy="11" r="2.6"/>
      <circle cx="25" cy="11" r="2.6"/>
      <circle cx="39" cy="11" r="2.6"/>
      <circle cx="11" cy="25" r="2.6"/>
      <circle cx="25" cy="25" r="2.6"/>
      <circle cx="53" cy="25" r="2.6"/>
      <circle cx="11" cy="39" r="2.6"/>
      <circle cx="39" cy="39" r="2.6"/>
      <circle cx="53" cy="39" r="2.6"/>
      <circle cx="25" cy="53" r="2.6"/>
      <circle cx="39" cy="53" r="2.6"/>
      <circle cx="53" cy="53" r="2.6"/>
    </g>
    <polyline points="11,53 25,39 39,25 53,11" fill="none" stroke="#6ea8dc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline class="pulse" pathLength="100" points="11,53 25,39 39,25 53,11" fill="none" stroke="#d6e9fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g>
      <circle class="halo" style="transform-origin:11px 53px;animation-delay:0.00s" cx="11" cy="53" r="4.2"/>
      <circle class="halo" style="transform-origin:25px 39px;animation-delay:0.68s" cx="25" cy="39" r="4.2"/>
      <circle class="halo" style="transform-origin:39px 25px;animation-delay:1.36s" cx="39" cy="25" r="4.2"/>
      <circle class="halo" style="transform-origin:53px 11px;animation-delay:2.03s" cx="53" cy="11" r="4.2"/>
    </g>
    <g fill="#6ea8dc">
      <circle cx="11" cy="53" r="4.2"/>
      <circle cx="25" cy="39" r="4.2"/>
      <circle cx="39" cy="25" r="4.2"/>
      <circle cx="53" cy="11" r="4.2"/>
    </g>
  </g>
  <text x="84" y="46" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#e6edf3">Inter<tspan fill="#6ea8dc">lab</tspan></text>
</svg>

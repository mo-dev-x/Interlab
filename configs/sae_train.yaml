# SAELens training config for Qwen2.5-14B
# Step 2: Train TopK SAE on layer 24 residual stream (post-MLP)

model_name: "Qwen/Qwen2.5-14B"
hook_name: "blocks.24.hook_resid_post"   # TransformerLens hook name
hook_layer: 24
hook_head_index: null

# Architecture
d_in: 5120              # Qwen2.5-14B hidden dim
expansion_factor: 16    # dictionary size = d_in * expansion_factor = 81920
b_dec_to_z: false
normalize_activations: "none"

architecture: "topk"    # TopK SAE — cleaner than ReLU for feature quality
k: 100                  # active features per token

# Data streaming
dataset_path: "NeelNanda/pile-10k"
is_dataset_tokenized: false
context_size: 512
prepend_bos: true
store_batch_size_prompts: 16

# Training
training_tokens: 200_000_000    # 200M tokens
train_batch_size_tokens: 4096

# Optimizer
lr: 2.0e-4
lr_scheduler_name: "cosine"
lr_warm_up_steps: 1000
lr_decay_steps: 5000
adam_beta1: 0.9
adam_beta2: 0.999

# L1 not used with TopK, kept for SAELens API compatibility
l1_coefficient: 0.0
l1_warm_up_steps: 0

# Logging & checkpointing
log_to_wandb: true
wandb_project: "qwen-sae-interp"
wandb_entity: null           # set to your wandb username if needed
wandb_log_frequency: 100
eval_every_n_wandb_logs: 10

n_checkpoints: 5
checkpoint_path: "results/sae_checkpoints"

# Compute
dtype: "bfloat16"
device: "cuda"
compile_llm: false           # set true on H100 for ~20% speedup via torch.compile
llm_batch_size: 4            # reduce if OOM
seed: 42
